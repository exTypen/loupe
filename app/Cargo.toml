[package]
name = "loupe"
version = "0.10.2"
edition.workspace = true

[lib]
name = "loupe_app"
path = "src/lib.rs"

[[bin]]
name = "loupe"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
loupe-core.workspace = true
loupe-code.workspace = true
loupe-forge.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.10"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Sparkle, loaded at run time (updates.rs).
objc2 = "0.6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Headless windows for interaction tests (#[gpui_kit::test], gpui_kit::test::TestWindowExt): see tests/headless.rs.
gpui-kit = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Headless end-to-end tests with real Metal pixels and screenshot baselines (tests/e2e/main.rs): one process, its own
# main, so the tests share the mock forge and run one after another.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false
