[package]
name = "loupe"
version = "0.10.0"
edition.workspace = true

[lib]
name = "loupe_app"
path = "src/lib.rs"

[[bin]]
name = "loupe"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
loupe-core.workspace = true
loupe-code.workspace = true
loupe-forge.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.10"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
